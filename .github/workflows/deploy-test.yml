name: Deploy test Worker

on:
  workflow_dispatch:

concurrency:
  group: cfbbs-test-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 11.15.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Apply test database migrations
        run: pnpm exec wrangler d1 migrations apply cfbbs-test-db --env test --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Configure R2 media credentials
        run: |
          if [[ -z "$R2_ACCESS_KEY_ID" || -z "$R2_SECRET_ACCESS_KEY" ]]; then
            echo "Set the R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY repository secrets first."
            exit 1
          fi
          printf '%s' "$R2_ACCESS_KEY_ID" | pnpm exec wrangler secret put S3_ACCESS_KEY_ID --env test
          printf '%s' "$R2_SECRET_ACCESS_KEY" | pnpm exec wrangler secret put S3_SECRET_ACCESS_KEY --env test
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy test Worker
        run: pnpm deploy:test
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
