name: cfbbs-misskey-test

services:
  misskey:
    image: misskey/misskey:2026.6.0
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${MISSKEY_BIND_ADDRESS:-127.0.0.1}:${MISSKEY_PORT:-3100}:3000"
    volumes:
      - misskey-files:/misskey/files
      - ./config:/misskey/.config:ro
    mem_limit: 1536m
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3000/api/meta'').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 90s

  db:
    image: postgres:16.9-alpine
    restart: "no"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-misskey}
      POSTGRES_USER: ${POSTGRES_USER:-misskey}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - misskey-postgres:/var/lib/postgresql/data
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.2-alpine
    restart: "no"
    command: redis-server --appendonly yes
    volumes:
      - misskey-redis:/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  misskey-files:
  misskey-postgres:
  misskey-redis:
